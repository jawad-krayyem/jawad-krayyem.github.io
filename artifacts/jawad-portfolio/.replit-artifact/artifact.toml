kind = "web"
previewPath = "/"
title = "Jawad Krayyem Portfolio"
description = "A responsive personal portfolio for software developer Jawad Krayyem, featuring his projects, portrait, interactive terminal, mini-games, theme switching, and privacy policy."
version = "1.0.0"
id = "artifacts/jawad-portfolio"
router = "path"

[[services]]
name = "web"
paths = ["/", "/_next/hmr"]
localPort = 18283

[services.development]
run = "pnpm --filter @workspace/jawad-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jawad-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/jawad-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18283"
BASE_PATH = "/"
